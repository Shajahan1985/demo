<!DOCTYPE html>
<html>
<head>
    <title>Test Hardware Serial Number Field</title>
    <style>
        .form-group { margin: 10px 0; }
        label { display: block; font-weight: bold; }
        select, input { padding: 5px; width: 300px; }
    </style>
</head>
<body>
    <h1>Test Hardware Serial Number Field</h1>
    
    <div class="form-group">
        <label for="id_system_type">System Type</label>
        <select id="id_system_type" onchange="handleSystemTypeChange(this.value)">
            <option value="">Select System Type</option>
            <option value="Desktop">Desktop</option>
            <option value="Laptop">Laptop</option>
            <option value="All-in-One PC">All-in-One PC</option>
        </select>
    </div>
    
    <div class="form-group" id="hardware_serial_number_group" style="display:none;">
        <label for="id_hardware_serial_number">Hardware Serial Number *</label>
        <input type="text" id="id_hardware_serial_number" placeholder="Enter hardware serial number">
    </div>
    
    <script>
    function handleSystemTypeChange(systemType) {
        const hardwareSerialNumberGroup = document.getElementById('hardware_serial_number_group');
        const hardwareSerialNumberInput = document.getElementById('id_hardware_serial_number');
        
        console.log('System type changed to:', systemType);
        
        // Show/hide and make required for Laptop and All-in-One PC
        if (systemType === 'Laptop' || systemType === 'All-in-One PC') {
            console.log('Showing hardware serial number field');
            hardwareSerialNumberGroup.style.display = 'block';
            hardwareSerialNumberInput.required = true;
        } else {
            console.log('Hiding hardware serial number field');
            hardwareSerialNumberGroup.style.display = 'none';
            hardwareSerialNumberInput.required = false;
            hardwareSerialNumberInput.value = '';
        }
    }
    </script>
</body>
</html>
